name: Terraform DEV

on:
  push:
    branches: [azure-deployment]
    paths: [terraform/**]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  plan-and-apply:
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=terraform init -reconfigure -backend-config=environments/dev/backend.hcl
      - name: Import existing DEV resource group
        run: terraform -chdir=terraform import -var-file=environments/dev/terraform.tfvars azurerm_resource_group.this /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/spectre-dev-rg
      - run: terraform -chdir=terraform plan -var-file=environments/dev/terraform.tfvars -out=dev.tfplan
      - run: terraform -chdir=terraform apply -auto-approve dev.tfplan
