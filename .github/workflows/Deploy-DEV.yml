name: Deploy Spectre AI DEV

on:
  push:
    branches: [azure-deployment]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: spectre-dev-rg
  CONTAINER_APP: spectre-dev-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push immutable image
        shell: bash
        run: |
          ACR_NAME=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[?name=='spectredevacrelvf5hav'].name" -o tsv)
          test -n "$ACR_NAME"
          az acr update --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --public-network-enabled true
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az acr network-rule add --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --ip-address "$RUNNER_IP/32"
          az acr build --registry "$ACR_NAME" --image "spectre:${{ github.sha }}" --file Dockerfile.azure .
          DIGEST=$(az acr repository show --name "$ACR_NAME" --image "spectre:${{ github.sha }}" --query digest -o tsv)
          echo "IMAGE=$ACR_NAME.azurecr.io/spectre@$DIGEST" >> "$GITHUB_ENV"
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
      - name: Deploy Container App
        shell: bash
        run: |
          DATABASE_URL=$(az keyvault secret show --vault-name spectredevkv --name database-url --query value -o tsv)
          SETUP_CODE=$(az keyvault secret show --vault-name spectredevkv --name spectre-setup-code --query value -o tsv)
          IDENTITY_ID=$(az identity show --name spectre-dev-app-id --resource-group "$RESOURCE_GROUP" --query id -o tsv)
          if az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --image "$IMAGE"
          else
            az containerapp create \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --environment spectre-dev-cae \
              --image "$IMAGE" \
              --target-port 8080 \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 3 \
              --cpu 1 \
              --memory 2Gi \
              --user-assigned "$IDENTITY_ID" \
              --registry-server "$ACR_NAME.azurecr.io" \
              --registry-identity "$IDENTITY_ID" \
              --secrets "database-url=$DATABASE_URL" "setup-code=$SETUP_CODE" \
              --env-vars NODE_ENV=production PORT=8080 STATIC_DIR=/app/artifacts/sentinel/dist/public DATABASE_URL=secretref:database-url SPECTRE_SETUP_CODE=secretref:setup-code
      - name: Initialize empty database
        shell: bash
        continue-on-error: true
        run: |
          az containerapp exec \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --command "node deployment/init-db.mjs"
          fi
      - name: Verify
        shell: bash
        run: |
          FQDN=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query "properties.configuration.ingress.fqdn" -o tsv)
          curl -fsSk "https://$FQDN/api/healthz"
          curl -fsSk "https://$FQDN/api/readyz"
      - name: Restore ACR private network
        if: always()
        shell: bash
        run: |
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az acr network-rule remove --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --ip-address "$RUNNER_IP/32" || true
          az acr update --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --public-network-enabled false
